version: '3.8'
services:
  chat-case-to-doc:
    image: ghcr.io/youxiao240388/chat-case-to-doc:latest
    container_name: chat-case-to-doc
    ports:
      - "2657:5000"
    volumes:
      - chat-case-data:/app/output
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

volumes:
  chat-case-data:
