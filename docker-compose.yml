services:
  chat-case-to-doc:
    build: .
    container_name: chat-case-to-doc
    ports:
      - "5000:5000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-sk-your-api-key}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
    volumes:
      - ./output:/app/output
    restart: unless-stopped
